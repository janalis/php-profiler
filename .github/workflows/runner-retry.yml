name: runner-retry
# GitHub sometimes never assigns a hosted runner to a job, most often on macOS: the job is
# cancelled before any step, and the quality gate fails without testing anything. This reruns
# such jobs, twice at most; a job that ran and failed is never rerun. A successful rerun
# completes the quality run, which continues the release as a first success would.
on:
  workflow_run:
    workflows: [quality]
    types: [completed]
permissions: {}
concurrency:
  group: runner-retry-${{ github.event.workflow_run.id }}
  cancel-in-progress: false
jobs:
  rerun:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      # The default branch's tooling: nothing from the run's own commit is executed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rerun jobs that never got a runner
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: scripts/php-tool.sh scripts/runner-retry.php "$REPOSITORY" "$RUN_ID"
