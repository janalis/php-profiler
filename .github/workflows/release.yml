name: automatic-alpha-release
on:
  workflow_run:
    workflows: [quality]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: alpha-release
  cancel-in-progress: false
jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
      (github.event.workflow_run.head_branch == 'main' ||
       (startsWith(github.event.workflow_run.head_branch, 'release/') &&
        github.event.workflow_run.event == 'workflow_dispatch' &&
        github.event.workflow_run.actor.login == 'github-actions[bot]'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test scripts/release-tools.test.mjs
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.99.1'
      - name: Advance the exact validated candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PUBLISHING_ENABLED: ${{ vars.PUBLISHING_ENABLED }}
          QUALITY_RUN_ID: ${{ github.event.workflow_run.id }}
        run: python3 scripts/release-automation.py "$QUALITY_RUN_ID"
